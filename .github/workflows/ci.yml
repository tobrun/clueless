name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # macos-26: the screencapturekit -> apple-metal Swift bridge needs the
    # macOS 26 SDK to compile (it references MTLSamplerReductionMode behind
    # an #available(macOS 26.0) check, which still must exist in the SDK).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.94.1; rustup installs it on the first cargo call
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Bundle
        run: cargo xtask bundle --identity -
