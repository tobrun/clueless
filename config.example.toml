# clueless config for app behavior. This file is optional: a missing file
# means all defaults. Every key is optional too; a missing key takes the
# default shown here. An unknown key is an error. Copy this file to
# ~/.config/clueless/config.toml (or pass --config) and edit.
#
# The LLM and ASR servers are NOT configured here; they come from the
# environment, see .env.example.

[audio]
system_audio_backend = "sck"  # "sck" | "cpal_loopback" | "device:<name>"
# mic_device = "MacBook Pro Microphone" # none means the default input
watchdog_restarts = 5         # stream restarts without a sample in between; 0 turns off
watchdog_silence_secs = 0     # restart after this long with no samples; 0 turns the timer off

[vad]
start_threshold = 0.5         # speech probability to start an utterance
end_threshold = 0.35          # below this counts as silence
end_silence_frames = 19       # 19 frames of 32 ms = 608 ms of silence ends an utterance
max_segment_ms = 15000        # forced cut length

[overlay]
hide_from_capture = true      # sets the panel's sharingType to none

[assist]
start_profile = "manual"      # "manual" | "interview" | "brainstorm"; manual sends nothing by itself

[trace]
enabled = true                # write a trace directory per meeting under the data dir
audio = false                 # also record the meeting audio to WAV files (opt-in)

[hotkeys]
# meeting-only keys (registered only while a meeting runs):
suggest = "cmd+Enter"
clear = "cmd+shift+KeyX"
move_left = "cmd+shift+ArrowLeft"
move_right = "cmd+shift+ArrowRight"
move_up = "cmd+shift+ArrowUp"
move_down = "cmd+shift+ArrowDown"
# always-on keys:
toggle_meeting = "cmd+shift+KeyR"
toggle_overlay = "cmd+Backslash"
toggle_mode = "cmd+shift+Backslash"
toggle_click_through = "cmd+shift+KeyM"
cycle_profile = "ctrl+alt+KeyP"       # steps manual, interview, brainstorm
